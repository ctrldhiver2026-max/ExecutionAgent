<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Execution Agent</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface-2: #f6f8fa;
    --surface-3: #eaeef2;
    --border: #d8dee4;
    --text: #1f2328;
    --text-dim: #57606a;
    --text-faint: #8c959f;
    --accent: #0969da;
    --accent-dim: rgba(9, 105, 218, 0.08);
    --green: #1a7f37;
    --red: #cf222e;
    --amber: #9a6700;
    --chip-bg: #eff2f5;
    --team-content-bg: rgba(154, 103, 0, 0.08);
    --team-content-fg: #9a6700;
    --team-content-bd: rgba(154, 103, 0, 0.35);
    --team-design-bg: rgba(130, 80, 223, 0.08);
    --team-design-fg: #8250df;
    --team-design-bd: rgba(130, 80, 223, 0.35);
    --team-dev-bg: rgba(26, 127, 55, 0.08);
    --team-dev-fg: #1a7f37;
    --team-dev-bd: rgba(26, 127, 55, 0.35);
    --team-video_design-bg: rgba(191, 66, 132, 0.08);
    --team-video_design-fg: #bf4284;
    --team-video_design-bd: rgba(191, 66, 132, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    height: 100%;
  }

  .app {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 300px;
    height: 100vh;
  }

  /* ============ Sidebar ============ */
  .sidebar {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--surface);
    min-height: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, #1f6feb, #4da3ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    flex-shrink: 0;
  }
  .brand-name {
    font-weight: 650;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-size: 0.7rem;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .refresh-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  .refresh-dot.pulsing { animation: pulse 1.2s ease-in-out infinite; }
  .refresh-dot.error { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }

  .side-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 10px;
    min-height: 0;
  }
  .side-label {
    font-size: 0.68rem;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-faint);
    padding: 4px 8px 6px;
  }
  .side-group { margin-bottom: 20px; }
  .side-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text-dim);
    font: inherit;
    font-size: 0.88rem;
    padding: 7px 10px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .side-item:hover { background: var(--surface-2); color: var(--text); }
  .side-item.active {
    background: var(--accent-dim);
    border-color: rgba(9, 105, 218, 0.3);
    color: var(--text);
    font-weight: 600;
  }
  .side-item .side-meta {
    display: block;
    font-size: 0.7rem;
    color: var(--text-faint);
    font-weight: 400;
  }
  .side-empty {
    padding: 6px 10px;
    font-size: 0.8rem;
    color: var(--text-faint);
    font-style: italic;
    white-space: normal;
  }

  .side-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 6px 8px;
  }
  .side-label-row .side-label { padding: 0; }
  .clear-all-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font: inherit;
    font-size: 0.68rem;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 5px;
  }
  .clear-all-btn:hover { color: var(--red); background: rgba(207, 34, 46, 0.08); }

  .side-item-row { display: flex; align-items: center; gap: 2px; }
  .side-item-row .side-item { flex: 1; min-width: 0; }
  .side-delete {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 0.82rem;
    padding: 4px 7px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .side-delete:hover { color: var(--red); background: rgba(207, 34, 46, 0.08); }

  .side-footer {
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 650;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .side-footer .who {
    font-size: 0.78rem;
    color: var(--text-dim);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .people-btn {
    margin-left: auto;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    font: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    padding: 5px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .people-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .people-btn.active {
    background: var(--accent-dim);
    border-color: rgba(9, 105, 218, 0.3);
    color: var(--text);
  }

  /* ============ Main column ============ */
  .main {
    overflow-y: auto;
    padding: 28px 32px 60px;
    min-width: 0;
  }

  .error-banner {
    display: none;
    background: rgba(207, 34, 46, 0.06);
    border: 1px solid rgba(207, 34, 46, 0.35);
    color: var(--red);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 0.85rem;
  }
  .error-banner.visible { display: block; }
  .error-banner .error-detail {
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 3px;
    word-break: break-word;
  }

  .state {
    text-align: center;
    padding: 90px 24px;
    color: var(--text-dim);
  }
  .state .state-icon { font-size: 2.2rem; margin-bottom: 14px; }
  .state p { max-width: 460px; margin: 0 auto; }

  .proj-head { margin-bottom: 6px; }
  .proj-title {
    font-size: 1.55rem;
    font-weight: 680;
    letter-spacing: -0.02em;
    word-break: break-word;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .proj-time { font-size: 0.8rem; color: var(--text-faint); margin-top: 2px; }
  .badge {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .badge-failed {
    background: rgba(207, 34, 46, 0.07);
    color: var(--red);
    border: 1px solid rgba(207, 34, 46, 0.35);
  }
  .badge-live {
    background: rgba(26, 127, 55, 0.08);
    color: var(--team-dev-fg);
    border: 1px solid rgba(26, 127, 55, 0.35);
  }

  .summary {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin: 12px 0 4px;
    max-width: 72ch;
    word-break: break-word;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin: 26px 0 10px;
  }

  .participants { display: flex; flex-wrap: wrap; gap: 10px; }
  .participant {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 14px 4px 5px;
    font-size: 0.84rem;
  }
  .participant .avatar { width: 26px; height: 26px; font-size: 0.66rem; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
  }

  .table-scroll { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    word-break: break-word;
  }
  th {
    color: var(--text-faint);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 650;
  }
  tr:last-child td { border-bottom: none; }
  td.owner-cell { color: var(--text-dim); }
  th.team-col, td.team-cell { width: 110px; white-space: nowrap; }

  .team-badge {
    display: inline-block;
    border-radius: 6px;
    padding: 2px 9px;
    font-size: 0.73rem;
    font-weight: 600;
    text-transform: lowercase;
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--text-dim);
  }
  .team-content { background: var(--team-content-bg); color: var(--team-content-fg); border-color: var(--team-content-bd); }
  .team-design  { background: var(--team-design-bg);  color: var(--team-design-fg);  border-color: var(--team-design-bd); }
  .team-dev     { background: var(--team-dev-bg);     color: var(--team-dev-fg);     border-color: var(--team-dev-bd); }
  .team-video_design { background: var(--team-video_design-bg); color: var(--team-video_design-fg); border-color: var(--team-video_design-bd); }

  .due-line {
    margin-top: 14px;
    font-size: 0.86rem;
    color: var(--text-dim);
    word-break: break-word;
  }
  .due-line .due-label { color: var(--amber); font-weight: 600; margin-right: 6px; }

  /* Minutes of the Meet */
  .minutes-panel { padding: 0; overflow: hidden; }
  .minutes-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 20px;
    font-size: 0.85rem;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .minutes-count { margin-left: auto; font-size: 0.75rem; color: var(--text-faint); }
  .transcript {
    max-height: 380px;
    overflow-y: auto;
    padding: 12px 20px 16px;
  }
  .t-line { font-size: 0.86rem; padding: 5px 0; word-break: break-word; }
  .t-speaker { color: var(--accent); font-weight: 600; }
  .t-text { color: var(--text-dim); }
  .empty-note { color: var(--text-faint); font-size: 0.84rem; font-style: italic; }

  /* People view */
  .people-hint { color: var(--text-dim); font-size: 0.86rem; margin: 10px 0 18px; }
  td.needs-role { background: rgba(154, 103, 0, 0.07); }
  .slack-yes { color: var(--green); }
  .slack-no { color: var(--text-faint); }
  select.team-select {
    background: var(--chip-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
  }
  select.team-select.unset { border-color: var(--amber); color: var(--amber); }
  .save-flash {
    font-size: 0.75rem;
    color: var(--green);
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .save-flash.visible { opacity: 1; }
  .save-flash.error { color: var(--red); }

  /* ============ Right rail ============ */
  .rail {
    border-left: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 22px 16px 40px;
    min-height: 0;
  }
  .rail-label {
    font-size: 0.68rem;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-faint);
    margin: 0 4px 10px;
  }
  .rail-group { margin-bottom: 26px; }

  /* Workflow timeline */
  .timeline { padding: 2px 4px 0; }
  .tl-item { position: relative; padding: 0 0 20px 26px; }
  .tl-item::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 18px;
    bottom: 2px;
    width: 2px;
    background: var(--border);
  }
  .tl-item:last-child::before { display: none; }
  .tl-dot {
    position: absolute;
    left: 0;
    top: 4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface-2);
  }
  .tl-item.done .tl-dot { border-color: var(--green); background: rgba(26, 127, 55, 0.15); }
  .tl-item.active .tl-dot {
    border-color: var(--amber);
    background: rgba(154, 103, 0, 0.15);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .tl-item.fail .tl-dot { border-color: var(--red); background: rgba(207, 34, 46, 0.12); }
  .tl-title { font-size: 0.84rem; font-weight: 600; word-break: break-word; }
  .tl-item.todo .tl-title { color: var(--text-faint); font-weight: 500; }
  .tl-item.fail .tl-title { color: var(--red); }
  .tl-item.active .tl-title { color: var(--team-content-fg); }
  .tl-desc { font-size: 0.76rem; color: var(--text-dim); margin-top: 1px; word-break: break-word; }
  .tl-item.todo .tl-desc { color: var(--text-faint); }
  .tl-desc a { color: var(--accent); text-decoration: none; }
  .tl-desc a:hover { text-decoration: underline; }
  .tl-time { font-size: 0.7rem; color: var(--text-faint); margin-top: 2px; }
  .rail-note {
    font-size: 0.72rem;
    color: var(--text-faint);
    font-style: italic;
    padding: 6px 4px 0;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .rail-empty {
    font-size: 0.8rem;
    color: var(--text-faint);
    font-style: italic;
    padding: 2px 4px;
  }

  /* ============ Responsive ============ */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 220px minmax(0, 1fr); }
    .rail { display: none; }
    .main-rail-fallback { display: block; }
  }
  @media (min-width: 1101px) {
    .main-rail-fallback { display: none; }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .sidebar {
      border-right: none;
      border-bottom: 1px solid var(--border);
      max-height: 45vh;
    }
    .main { padding: 20px 16px 50px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ Left sidebar ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">EA</div>
      <div>
        <div class="brand-name">Execution Agent</div>
        <div class="brand-sub">
          <span class="refresh-dot" id="refresh-dot"></span>
          <span id="refresh-text">Loading…</span>
        </div>
      </div>
    </div>

    <div class="side-scroll">
      <div class="side-group">
        <div class="side-label-row">
          <div class="side-label">Projects</div>
          <button type="button" class="clear-all-btn" id="clear-all-btn">Clear all</button>
        </div>
        <div id="project-list">
          <div class="side-empty">Loading…</div>
        </div>
      </div>

      <div class="side-group">
        <div class="side-label">Upcoming</div>
        <div id="upcoming-list">
          <div class="side-empty">Loading…</div>
        </div>
      </div>
    </div>

    <div class="side-footer">
      <span class="avatar" id="me-avatar">EA</span>
      <span class="who">Ctrl+D's</span>
      <button type="button" class="people-btn" id="people-btn">People</button>
    </div>
  </aside>

  <!-- ============ Center ============ -->
  <main class="main">
    <div class="error-banner" id="error-banner"></div>
    <div id="main-content">
      <div class="state">
        <div class="state-icon">⏳</div>
        <p>Loading meetings…</p>
      </div>
    </div>
  </main>

  <!-- ============ Right rail ============ -->
  <aside class="rail">
    <div class="rail-group">
      <div class="rail-label">Workflow</div>
      <div id="rail-timeline"><div class="rail-empty">Select a project.</div></div>
    </div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  var REFRESH_MS = 20000;
  // Relative when served from the deployment (incl. per-branch preview
  // URLs); absolute fallback so the page also works opened as a local file
  // or in an editor preview panel.
  var isDeployed = /\.vercel\.app$/.test(location.hostname);
  var BASE = isDeployed ? "" : "https://execution-agent.vercel.app";
  var API_URL = BASE + "/api/meetings/list";
  var ROSTER_LIST_URL = BASE + "/api/roster/list";
  var ROSTER_UPDATE_URL = BASE + "/api/roster/update";
  var UPCOMING_URL = BASE + "/api/calendar/upcoming";
  var PIPELINE_URL = BASE + "/api/pipeline/status";
  var DELETE_URL = BASE + "/api/meetings/delete";

  var mainContentEl = document.getElementById("main-content");
  var projectListEl = document.getElementById("project-list");
  var upcomingListEl = document.getElementById("upcoming-list");
  var railTimelineEl = document.getElementById("rail-timeline");
  var errorBanner = document.getElementById("error-banner");
  var refreshDot = document.getElementById("refresh-dot");
  var refreshText = document.getElementById("refresh-text");
  var peopleBtn = document.getElementById("people-btn");
  var clearAllBtn = document.getElementById("clear-all-btn");

  var meetings = [];          // last good fetch
  var roster = [];
  var pipeline = { confirmations: [], projects: [], loaded: false, error: false };
  var selectedKey = null;     // key of the selected meeting
  var view = "project";       // "project" | "people"
  var hasRenderedData = false;
  var lastFetchTime = null;

  // ---------- DOM helpers (all content set via textContent; never innerHTML) ----------

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function asString(v) { return (typeof v === "string") ? v : ""; }

  function nonEmpty(v) { return typeof v === "string" && v.trim().length > 0; }

  function initials(name) {
    var parts = asString(name).trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    var s = parts[0].charAt(0);
    if (parts.length > 1) s += parts[parts.length - 1].charAt(0);
    return s;
  }

  function meetingKey(m) {
    return nonEmpty(m.id) ? m.id : (asString(m.meeting_id) + "|" + asString(m.created_at));
  }

  function meetingTitle(m) {
    var extracted = (m.extracted && typeof m.extracted === "object") ? m.extracted : null;
    if (extracted && nonEmpty(extracted.project_name)) return extracted.project_name;
    if (nonEmpty(m.meeting_id)) return m.meeting_id;
    return "Untitled meeting";
  }

  // ---------- Time formatting ----------

  function formatRelative(iso) {
    if (!nonEmpty(iso)) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var diff = Date.now() - d.getTime();
    if (diff < 0) diff = 0;
    var sec = Math.floor(diff / 1000);
    if (sec < 60) return "just now";
    var min = Math.floor(sec / 60);
    if (min < 60) return min + " min ago";
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + (hr === 1 ? " hour ago" : " hours ago");
    var day = Math.floor(hr / 24);
    if (day < 7) return day + (day === 1 ? " day ago" : " days ago");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function formatFull(iso) {
    if (!nonEmpty(iso)) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  // ---------- Sidebar: projects ----------

  function renderProjectList() {
    clear(projectListEl);
    if (meetings.length === 0) {
      projectListEl.appendChild(el("div", "side-empty",
        "No meetings captured yet — run a Meet call with the extension loaded."));
      return;
    }
    meetings.forEach(function (m) {
      if (!m || typeof m !== "object") return;
      var key = meetingKey(m);
      var row = el("div", "side-item-row");

      var btn = el("button", "side-item" + (view === "project" && key === selectedKey ? " active" : ""));
      btn.type = "button";
      btn.appendChild(document.createTextNode(meetingTitle(m)));
      btn.appendChild(el("span", "side-meta", formatRelative(m.created_at)));
      btn.addEventListener("click", function () {
        selectedKey = key;
        view = "project";
        renderAll();
      });
      row.appendChild(btn);

      var del = el("button", "side-delete", "✕");
      del.type = "button";
      del.title = "Delete this meeting";
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        deleteMeetingCard(m);
      });
      row.appendChild(del);

      projectListEl.appendChild(row);
    });
  }

  function selectedMeeting() {
    for (var i = 0; i < meetings.length; i++) {
      if (meetingKey(meetings[i]) === selectedKey) return meetings[i];
    }
    return meetings.length > 0 ? meetings[0] : null;
  }

  // ---------- Center: project view ----------

  function teamBadge(team) {
    var t = asString(team).trim().toLowerCase();
    var cls = "team-badge";
    if (t === "content") cls += " team-content";
    else if (t === "design") cls += " team-design";
    else if (t === "dev") cls += " team-dev";
    else if (t === "video_design") cls += " team-video_design";
    return el("span", cls, t === "video_design" ? "Video Design" : (t || "—"));
  }

  function renderDeliverablesTable(deliverables) {
    var panel = el("div", "panel");
    var scroll = el("div", "table-scroll");
    var table = el("table");

    var thead = el("thead");
    var headRow = el("tr");
    headRow.appendChild(el("th", "team-col", "Team"));
    headRow.appendChild(el("th", null, "Task"));
    headRow.appendChild(el("th", null, "Owner"));
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = el("tbody");
    deliverables.forEach(function (d) {
      if (!d || typeof d !== "object") return;
      var tr = el("tr");
      var tdTeam = el("td", "team-cell");
      tdTeam.appendChild(teamBadge(d.team));
      tr.appendChild(tdTeam);
      tr.appendChild(el("td", null, nonEmpty(d.task) ? d.task : "—"));
      tr.appendChild(el("td", "owner-cell", nonEmpty(d.owner_name) ? d.owner_name : "—"));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    panel.appendChild(scroll);
    return panel;
  }

  function renderMinutes(transcript) {
    var lines = Array.isArray(transcript) ? transcript : [];
    var panel = el("div", "panel minutes-panel");

    var head = el("div", "minutes-head");
    head.appendChild(document.createTextNode("Minutes of the Meet"));
    head.appendChild(el("span", "minutes-count", lines.length + " lines"));
    panel.appendChild(head);

    var body = el("div", "transcript");
    if (lines.length === 0) {
      body.appendChild(el("div", "empty-note", "No transcript lines captured."));
    } else {
      lines.forEach(function (line) {
        if (!line || typeof line !== "object") return;
        var row = el("div", "t-line");
        row.appendChild(el("span", "t-speaker", (nonEmpty(line.speaker) ? line.speaker : "Unknown") + ": "));
        row.appendChild(el("span", "t-text", asString(line.text)));
        body.appendChild(row);
      });
    }
    panel.appendChild(body);
    return panel;
  }

  function renderProjectView(m) {
    var frag = document.createDocumentFragment();
    var extracted = (m.extracted && typeof m.extracted === "object") ? m.extracted : null;

    // Title
    var head = el("div", "proj-head");
    var title = el("h1", "proj-title", meetingTitle(m));
    if (!extracted) title.appendChild(el("span", "badge badge-failed", "extraction failed"));
    if (m.ended_at === null || m.ended_at === undefined) {
      title.appendChild(el("span", "badge badge-live", "in progress"));
    }
    head.appendChild(title);
    var time = el("div", "proj-time", "Captured " + formatRelative(m.created_at));
    time.title = formatFull(m.created_at);
    head.appendChild(time);
    frag.appendChild(head);

    // Summary
    if (extracted && nonEmpty(extracted.summary)) {
      frag.appendChild(el("p", "summary", extracted.summary));
    }

    // Participants
    var attendees = Array.isArray(m.attendees) ? m.attendees : [];
    if (attendees.length > 0) {
      frag.appendChild(el("div", "section-label", "Participants"));
      var row = el("div", "participants");
      attendees.forEach(function (name) {
        var p = el("span", "participant");
        p.appendChild(el("span", "avatar", initials(name)));
        p.appendChild(document.createTextNode(nonEmpty(name) ? name : "Unknown"));
        row.appendChild(p);
      });
      frag.appendChild(row);
    }

    // Deliverables
    if (extracted && Array.isArray(extracted.deliverables) && extracted.deliverables.length > 0) {
      frag.appendChild(el("div", "section-label", "Deliverables"));
      frag.appendChild(renderDeliverablesTable(extracted.deliverables));
    }

    // Due dates
    if (extracted && nonEmpty(extracted.due_dates)) {
      var due = el("div", "due-line");
      due.appendChild(el("span", "due-label", "Due:"));
      due.appendChild(document.createTextNode(extracted.due_dates));
      frag.appendChild(due);
    }

    // Minutes of the Meet
    frag.appendChild(el("div", "section-label", "Minutes of the Meet"));
    frag.appendChild(renderMinutes(m.transcript));

    return frag;
  }

  // ---------- Right rail: workflow timeline for the selected project ----------

  function latestByMeetingId(rows, mid) {
    if (!nonEmpty(mid)) return null;
    // Rows arrive newest-first from the API; first match wins.
    for (var i = 0; i < rows.length; i++) {
      if (rows[i] && typeof rows[i] === "object" && rows[i].meeting_id === mid) return rows[i];
    }
    return null;
  }

  function buildTimeline(m) {
    var extracted = (m.extracted && typeof m.extracted === "object") ? m.extracted : null;
    var conf = latestByMeetingId(pipeline.confirmations, asString(m.meeting_id));
    var proj = latestByMeetingId(pipeline.projects, asString(m.meeting_id));
    var attendees = Array.isArray(m.attendees) ? m.attendees : [];
    var lines = Array.isArray(m.transcript) ? m.transcript : [];
    var steps = [];

    // 1. Capture
    steps.push({
      state: "done",
      title: "Meeting captured",
      desc: attendees.length + (attendees.length === 1 ? " participant" : " participants")
        + " · " + lines.length + " transcript lines",
      time: nonEmpty(m.ended_at) ? m.ended_at : m.created_at,
    });

    // 2. Extraction
    if (extracted) {
      var dCount = Array.isArray(extracted.deliverables) ? extracted.deliverables.length : 0;
      steps.push({
        state: "done",
        title: "AI extraction",
        desc: dCount + (dCount === 1 ? " deliverable" : " deliverables")
          + (nonEmpty(extracted.project_name) ? " · “" + extracted.project_name + "”" : ""),
        time: m.created_at,
      });
    } else {
      steps.push({
        state: "fail",
        title: "AI extraction failed",
        desc: "No structured project could be extracted from this transcript.",
        time: m.created_at,
      });
    }

    // 3. Confirmation (Slack Yes/No DM)
    var status = conf ? asString(conf.status).toLowerCase() : "";
    if (conf && status === "confirmed") {
      steps.push({
        state: "done",
        title: "Confirmed via Slack",
        desc: "Organizer approved the project from the Yes/No DM.",
        time: conf.created_at,
      });
    } else if (conf && status === "rejected") {
      steps.push({
        state: "fail",
        title: "Rejected via Slack",
        desc: "Organizer declined — pipeline stopped here.",
        time: conf.created_at,
      });
    } else if (conf) {
      steps.push({
        state: "active",
        title: "Awaiting confirmation",
        desc: "Yes/No DM sent to the organizer on Slack.",
        time: conf.created_at,
      });
    } else {
      steps.push({
        state: "todo",
        title: "Confirmation",
        desc: extracted ? "Slack Yes/No DM to the meeting organizer." : "Skipped — nothing extracted.",
      });
    }

    var stopped = status === "rejected" || !extracted;

    // 4. Workspace provisioning (Slack channel + ClickUp)
    if (proj) {
      steps.push({
        state: "done",
        title: "Workspace provisioned",
        desc: "Slack channel created · ClickUp parent task + subtasks",
        link: (nonEmpty(proj.clickup_url) && /^https:\/\//.test(proj.clickup_url))
          ? { href: proj.clickup_url, label: "Open in ClickUp →" } : null,
        time: proj.created_at,
      });
      steps.push({
        state: "done",
        title: "Team notified",
        desc: "Kickoff message with owners posted in the new channel.",
        time: proj.created_at,
      });
    } else {
      steps.push({
        state: "todo",
        title: "Workspace provisioning",
        desc: stopped ? "—" : "Slack channel + ClickUp ticket, created on confirm.",
      });
      steps.push({
        state: "todo",
        title: "Team notified",
        desc: stopped ? "—" : "Kickoff message with assigned owners.",
      });
    }

    return steps;
  }

  function renderRail(m) {
    clear(railTimelineEl);
    if (!m) {
      railTimelineEl.appendChild(el("div", "rail-empty", "Select a project."));
      return;
    }

    var list = el("div", "timeline");
    buildTimeline(m).forEach(function (step) {
      var item = el("div", "tl-item " + step.state);
      item.appendChild(el("span", "tl-dot"));
      item.appendChild(el("div", "tl-title", step.title));
      if (nonEmpty(step.desc)) {
        var desc = el("div", "tl-desc", step.desc);
        if (step.link) {
          desc.appendChild(document.createTextNode(" "));
          var a = document.createElement("a");
          a.href = step.link.href;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = step.link.label;
          desc.appendChild(a);
        }
        item.appendChild(desc);
      }
      if (nonEmpty(step.time)) {
        var t = el("div", "tl-time", formatRelative(step.time));
        t.title = formatFull(step.time);
        item.appendChild(t);
      }
      list.appendChild(item);
    });
    railTimelineEl.appendChild(list);

    if (pipeline.error) {
      railTimelineEl.appendChild(el("div", "rail-note",
        "Live confirmation/provisioning status unavailable — showing capture data only."));
    }
  }

  // ---------- Center: people view ----------

  function renderPeopleView() {
    var frag = document.createDocumentFragment();
    var head = el("div", "proj-head");
    head.appendChild(el("h1", "proj-title", "People"));
    frag.appendChild(head);
    frag.appendChild(el("p", "people-hint",
      "Auto-populated from calendar invites + Slack. Rows in amber need a role set manually."));

    if (roster.length === 0) {
      var box = el("div", "state");
      box.appendChild(el("div", "state-icon", "👥"));
      box.appendChild(el("p", null,
        "No people yet — roster rows are created automatically the first time someone appears on a calendar invite."));
      frag.appendChild(box);
      return frag;
    }

    var panel = el("div", "panel");
    var scroll = el("div", "table-scroll");
    var table = el("table");
    var thead = el("thead");
    var headRow = el("tr");
    headRow.appendChild(el("th", null, "Name"));
    headRow.appendChild(el("th", null, "Email"));
    headRow.appendChild(el("th", null, "Slack"));
    headRow.appendChild(el("th", "team-col", "Team"));
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = el("tbody");
    roster.forEach(function (person) {
      if (!person || typeof person !== "object") return;
      var tr = el("tr");
      tr.appendChild(el("td", null, nonEmpty(person.name) ? person.name : "—"));
      tr.appendChild(el("td", null, nonEmpty(person.email) ? person.email : "—"));

      var slackTd = el("td", null);
      slackTd.appendChild(el("span", person.slack_id ? "slack-yes" : "slack-no", person.slack_id ? "✓ linked" : "not linked"));
      tr.appendChild(slackTd);

      var teamTd = el("td", "team-cell");
      if (!person.team) teamTd.classList.add("needs-role");
      if (nonEmpty(person.id)) {
        var select = document.createElement("select");
        select.className = "team-select" + (person.team ? "" : " unset");
        [["", "— set role —"], ["content", "content"], ["design", "design"], ["dev", "dev"], ["video_design", "Video Design"]].forEach(function (opt) {
          var o = document.createElement("option");
          o.value = opt[0];
          o.textContent = opt[1];
          if ((person.team || "") === opt[0]) o.selected = true;
          select.appendChild(o);
        });
        var flash = el("span", "save-flash", "Saved");
        select.addEventListener("change", function () {
          var newTeam = select.value;
          if (!newTeam) return;
          select.disabled = true;
          fetch(ROSTER_UPDATE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: person.id, team: newTeam }),
          })
            .then(function (res) {
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.json();
            })
            .then(function () {
              select.disabled = false;
              select.className = "team-select";
              flash.textContent = "Saved";
              flash.classList.remove("error");
              flash.classList.add("visible");
              setTimeout(function () { flash.classList.remove("visible"); }, 1800);
            })
            .catch(function () {
              select.disabled = false;
              flash.textContent = "Failed to save";
              flash.classList.add("visible", "error");
            });
        });
        teamTd.appendChild(select);
        teamTd.appendChild(flash);
      } else {
        teamTd.appendChild(teamBadge(person.team));
      }
      tr.appendChild(teamTd);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    panel.appendChild(scroll);
    frag.appendChild(panel);
    return frag;
  }

  // ---------- States ----------

  function renderEmptyState() {
    var box = el("div", "state");
    box.appendChild(el("div", "state-icon", "📭"));
    box.appendChild(el("p", null, "No meetings captured yet — run a Meet call with the extension loaded."));
    return box;
  }

  function renderErrorState(message) {
    var box = el("div", "state");
    box.appendChild(el("div", "state-icon", "⚠️"));
    box.appendChild(el("p", null, "Could not load meetings. Retrying automatically every 20 seconds."));
    var detail = el("p", null, asString(message));
    detail.style.marginTop = "10px";
    detail.style.color = "var(--text-faint)";
    detail.style.fontSize = "0.85rem";
    box.appendChild(detail);
    return box;
  }

  // ---------- Master render ----------

  function renderAll() {
    renderProjectList();
    peopleBtn.classList.toggle("active", view === "people");

    clear(mainContentEl);
    if (view === "people") {
      mainContentEl.appendChild(renderPeopleView());
      renderRail(selectedMeeting());
      return;
    }

    var m = selectedMeeting();
    if (!m) {
      mainContentEl.appendChild(renderEmptyState());
      renderRail(null);
      return;
    }
    selectedKey = meetingKey(m);
    renderProjectList(); // re-render so the resolved selection is highlighted
    mainContentEl.appendChild(renderProjectView(m));
    renderRail(m);
  }

  // ---------- Sidebar: upcoming ----------

  function renderUpcoming(events) {
    clear(upcomingListEl);
    if (events.length === 0) {
      upcomingListEl.appendChild(el("div", "side-empty",
        "No upcoming meetings — schedule a Calendar invite with a Meet link."));
      return;
    }
    events.forEach(function (ev) {
      if (!ev || typeof ev !== "object") return;
      var item = el("div", "side-item");
      item.style.cursor = "default";
      item.appendChild(document.createTextNode(nonEmpty(ev.title) ? ev.title : "(untitled meeting)"));
      if (nonEmpty(ev.start_at)) {
        item.appendChild(el("span", "side-meta", formatFull(ev.start_at)));
      }
      upcomingListEl.appendChild(item);
    });
  }

  // ---------- Status / errors ----------

  function setRefreshStatus(ok, fetching) {
    refreshDot.classList.toggle("error", !ok);
    refreshDot.classList.toggle("pulsing", !!fetching);
    if (fetching) {
      refreshText.textContent = "Refreshing…";
    } else if (ok) {
      refreshText.textContent = "updated " + (lastFetchTime ? formatRelative(lastFetchTime.toISOString()) : "just now");
    } else {
      refreshText.textContent = "retrying in 20s";
    }
  }

  function showErrorBanner(message) {
    clear(errorBanner);
    errorBanner.appendChild(el("div", null, "Failed to fetch meetings — retrying every 20 seconds."));
    errorBanner.appendChild(el("div", "error-detail", asString(message)));
    errorBanner.classList.add("visible");
  }

  function hideErrorBanner() {
    errorBanner.classList.remove("visible");
  }

  // ---------- Fetch loops ----------

  function refreshMeetings() {
    setRefreshStatus(true, true);
    fetch(API_URL, { headers: { "Accept": "application/json" }, cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
        return res.json();
      })
      .then(function (data) {
        meetings = (data && Array.isArray(data.meetings)) ? data.meetings : [];
        lastFetchTime = new Date();
        hasRenderedData = true;
        hideErrorBanner();
        renderAll();
        setRefreshStatus(true, false);
      })
      .catch(function (err) {
        var message = (err && err.message) ? err.message : String(err);
        if (hasRenderedData) {
          showErrorBanner(message);
        } else {
          clear(mainContentEl);
          mainContentEl.appendChild(renderErrorState(message));
          clear(projectListEl);
          projectListEl.appendChild(el("div", "side-empty", "Could not load projects."));
        }
        setRefreshStatus(false, false);
      });
  }

  function refreshPeople() {
    fetch(ROSTER_LIST_URL, { headers: { "Accept": "application/json" }, cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
        return res.json();
      })
      .then(function (data) {
        roster = (data && Array.isArray(data.roster)) ? data.roster : [];
        if (view === "people") renderAll();
      })
      .catch(function () { /* people view shows stale data on error */ });
  }

  function refreshPipeline() {
    fetch(PIPELINE_URL, { headers: { "Accept": "application/json" }, cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
        return res.json();
      })
      .then(function (data) {
        pipeline.confirmations = (data && Array.isArray(data.confirmations)) ? data.confirmations : [];
        pipeline.projects = (data && Array.isArray(data.projects)) ? data.projects : [];
        pipeline.loaded = true;
        pipeline.error = false;
        renderRail(selectedMeeting());
      })
      .catch(function () {
        pipeline.error = true;
        renderRail(selectedMeeting());
      });
  }

  function refreshUpcoming() {
    fetch(UPCOMING_URL, { headers: { "Accept": "application/json" }, cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
        return res.json();
      })
      .then(function (data) {
        renderUpcoming((data && Array.isArray(data.events)) ? data.events : []);
      })
      .catch(function () {
        clear(upcomingListEl);
        upcomingListEl.appendChild(el("div", "side-empty", "Could not load upcoming."));
      });
  }

  // ---------- Delete ----------

  function postDelete(body) {
    return fetch(DELETE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  function deleteMeetingCard(m) {
    var label = meetingTitle(m);
    if (!window.confirm('Delete "' + label + '"? This also removes its Slack/ClickUp project record.')) return;
    postDelete({ id: m.id, meeting_id: m.meeting_id })
      .then(refreshMeetings)
      .catch(function (err) {
        window.alert("Failed to delete: " + ((err && err.message) || err));
      });
  }

  function clearAllMeetings() {
    if (!window.confirm("Delete ALL projects and their Slack/ClickUp records? This cannot be undone.")) return;
    postDelete({ all: true })
      .then(function () {
        selectedKey = null;
        refreshMeetings();
      })
      .catch(function (err) {
        window.alert("Failed to clear: " + ((err && err.message) || err));
      });
  }

  // ---------- Wire up ----------

  clearAllBtn.addEventListener("click", clearAllMeetings);

  peopleBtn.addEventListener("click", function () {
    view = (view === "people") ? "project" : "people";
    if (view === "people" && roster.length === 0) refreshPeople();
    renderAll();
  });

  refreshMeetings();
  refreshPeople();
  refreshUpcoming();
  refreshPipeline();
  setInterval(refreshMeetings, REFRESH_MS);
  setInterval(refreshPeople, REFRESH_MS);
  setInterval(refreshUpcoming, REFRESH_MS);
  setInterval(refreshPipeline, REFRESH_MS);

  // Keep "updated X ago" text fresh between fetches.
  setInterval(function () {
    if (lastFetchTime && !errorBanner.classList.contains("visible")) {
      setRefreshStatus(true, false);
    }
  }, 30000);
})();
</script>
</body>
</html>
